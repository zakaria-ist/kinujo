<VirtualHost *:80>
  ServerName kinujo-release.c2sg.asia
  DocumentRoot /var/www

  Alias /static /var/www/kinujo_release/static
  <Directory "/var/www/kinujo_release/static">
    Options FollowSymLinks
    Order allow,deny
    Allow from all
    Require all granted
  </Directory>

   ErrorLog /var/log/httpd/kinujo_release/error.log
   CustomLog /var/log/httpd/kinujo_release/access.log combined

   WSGIPassAuthorization On
   WSGIDaemonProcess kinujo_release python-home=/var/www/.env python-path=/var/www/kinujo_release:/var/www/.env/lib/python3.7/site-packages
   WSGIProcessGroup kinujo_release
   WSGIScriptAlias / /var/www/kinujo_release/kinujo/wsgi_release.py

   <Directory /var/www/kinujo_release/kinujo>
     RewriteEngine on
     RewriteCond %{HTTP:X-Forwarded-Proto} !https [NC]
     RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

     <Files wsgi_release.py>
       Order allow,deny
       Allow from all
       Require all granted
     </Files>
   </Directory>
</VirtualHost>
