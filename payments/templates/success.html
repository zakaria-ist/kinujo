<!DOCTYPE html>
{% load static %}
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kinujo Payment</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.min.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}?{% now 'H' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/style-responsive.css' %}"/>
  </head>
  <body>
  <section class="section">
    <div class="container text-center">
      <h1>Your payment succeed.</h1>
    </div>
  </section>
  <section class="section">
    <div class="container text-center">
      <a id="app_link" class="btn btn-info">Return</a>
    </div>
  </section>
  <script type="text/javascript" src="{% static 'js/jquery.js' %}"></script>
  <script type="text/javascript" src="{% static 'js/bootstrap.min.js' %}"></script>
  <script type="text/javascript">
    var baseUrl = window.location.origin;
    var session_id = "{{session_id}}";
    var stripe_session = JSON.parse(window.sessionStorage.getItem('stripe_session'));
    console.log('session_id', session_id);
    console.log('stripe_session', stripe_session);
    if (stripe_session && stripe_session != '' && stripe_session.sessionId == session_id) {
      fetch(baseUrl + '/api/pay/' + stripe_session.userId + "/", {
          method: 'POST',
          headers: {
              'Accept': 'application/json',
              'Content-Type': 'application/json'
          },
          body: JSON.stringify({
                  checkoutSessionId: session_id,
                  products: stripe_session.products,
                  address: stripe_session.address,
                  tax: stripe_session.tax,
              })
          })
          .then(function(response) {
              return response.json();
          })
          .then(function(response) {
              seller = response.sellers;
              console.log('seller', seller);
              $('#app_link').attr('href', 'net.c2sg.kinujo://complete/success/' + stripe_session.seller + '/' + seller);
              $('#app_link')[0].click();
              window.sessionStorage.setItem('stripe_session', '');
              window.open('','_self');
              window.close();
          })
          .catch(function (error) {
              console.log(error);
          });
    }
  </script>
  </body>
</html>
