{% block extrahead %}
    {% load i18n %}
{% endblock %}
<section class="panel">
    <header class="panel-heading pb-5" style="font-size: 25px">
        <strong>{% trans 'Salon Information' %}</strong>
    </header>
    <div class="col-lg-12">
        <div class="form-group row">
            <label for="salon_name" class="col-lg-2 control-label">{% trans 'Salon Name' %}<span
                    class="span-required">(*)</span></label>
            <div class="col-lg-6">
                <input class="form-control trs-field" type="text"
                    name="salon_name"
                    id="salon_name">
            </div>
        </div>
        <div class="form-group row">
            <label for="pic_name" class="col-lg-2 control-label">{% trans "Representative's Name" %}<span
                    class="span-required">(*)</span></label>
            <div class="col-lg-6">
                <input class="form-control trs-field" type="text"
                    name="pic_name"
                    id="pic_name">
            </div>
        </div>
        <div class="form-group row">
            <label for="salon_zip_code" class="col-lg-2 control-label">{% trans 'Zip Code' %}<span
                    class="span-required">(*)</span></label>
            <div class="col-lg-6">
                <input class="form-control trs-field" type="text"
                    name="salon_zip_code"
                    id="salon_zip_code"
                    maxlength="8"
                    placeholder="">
            </div>
        </div>
        <div class="form-group row">
            <label for="salon_prefecture" class="col-lg-2 control-label">{% trans 'Prefecture' %}<span
                    class="span-required">(*)</span></label>
            <div class="col-lg-6">
                <select name="salon_prefecture" id="salon_prefecture" class="form-control trs-field">
                    {% for pr in prefecture_list %}
                        <option value="{{pr.0}}" selected>{{pr.1}}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group row">
            <label for="salon_address1" class="col-lg-2 control-label">{% trans 'Address One' %}<span
                    class="span-required">(*)</span></label>
            <div class="col-lg-6">
                <input class="form-control trs-field" type="text"
                    name="salon_address1"
                    id="salon_address1"
                    placeholder="">
            </div>
        </div>
        <div class="form-group row">
            <label for="salon_address2" class="col-lg-2 control-label">{% trans 'Address Two' %}<span
                    class="span-required">(*)</span></label>
            <div class="col-lg-6">
                <input class="form-control trs-field" type="text"
                    name="salon_address2"
                    id="salon_address2"
                    placeholder="">
            </div>
        </div>
        <div class="form-group row">
            <label for="pic_tel" class="col-lg-2 control-label">{% trans 'Phone Number' %}<span
                    class="span-required">(*)</span></label>
            <div class="col-lg-6">
                <input class="form-control trs-field" type="text"
                    name="pic_tel"
                    id="pic_tel"
                    placeholder="">
            </div>
        </div>
        <div class="form-group row">
            <div class="text-center">
                <button type="button" onclick="saveSalonInfo()" name="btnSalonSave" id="btnSalonSave" class="btn btn-primary blue-btn">{% trans 'Save' %}</button>
                <a class="btn btn-default gray-btn" onclick="cancelSalonForm()">{% trans 'Cancel' %}</a>
            </div>
        </div>
    </div>
</section>

<script>
$('#salon_zip_code').jpostal({   
      postcode : [
        '#salon_zip_code'
      ],
      address : {
        '#salon_prefecture'  : '%3',
        '#salon_address1'  : '%4, %5',
        '#salon_address2'  : '%8, %9, %10',
      }
  });
</script>
