{% block extrahead %}
    {% load i18n %}
{% endblock %}
<header class="panel-heading" style="font-size: 25px">
    <strong>{% trans 'Sales Information' %}</strong>
</header>
<div class="table-section white-bg">
    <div class="adv-table table-responsive">
        <table class="display table table-bordered table-striped table-condensed"
            id="sales-table" style="width:100%">
            <thead>
            <tr>
                <th style="min-width: 75px !important">{% trans 'Date' %}</th>
                <th></th>
                <th>{% trans 'Product' %}</th>
                <th>{% trans 'Price/Fee' %}</th>
                <th>{% trans 'Shipping' %}</th>
                <th style="min-width: 75px !important">{% trans "Sales Amount" %}</th>
            </tr>
            </thead>
        </table>
    </div>
</div>
