{% block extrahead %}
    {% load i18n %}
{% endblock %}
<header class="panel-heading" style="font-size: 25px">
    <strong>{% trans 'Commission Information' %}</strong>
</header>
<div class="table-section white-bg">
    <div class="adv-table table-responsive">
        <table class="display table table-bordered table-striped table-condensed"
            id="commssion-table" style="width:100%">
            <thead>
            <tr>
                <th style="min-width: 75px !important">{% trans 'Date' %}</th>
                <th></th>
                <th style="min-width: 75px !important">{% trans 'Product' %}</th>
                <th style="min-width: 75px !important">{% trans "Seller" %}</th>
                <th style="min-width: 75px !important">{% trans 'Selling Price' %}</th>
                <th style="min-width: 75px !important">{% trans 'Commission' %}</th>
            </tr>
            </thead>
        </table>
    </div>
</div>
