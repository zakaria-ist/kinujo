{% block extrahead %}
    {% load i18n %}
{% endblock %}

{% load i18n %}
<header class="panel-heading" style="font-size: 25px">
        {% trans 'Product Management' %}
</header>
<div class="table-section white-bg">
    <div class="text-right pb-3">
        <span class="">
            <a class="btn btn-primary blue-btn" onclick="showProductForm()"> 
                <span>{% trans 'Add' %}</span>
            </a>
        </span>
    </div>
    <div class="adv-table table-responsive">
        <table class="display table table-bordered table-striped table-condensed"
            id="item-table" style="width:100%">
            <thead>
            <tr>
                <th>#</th>
                <th></th>
                <th style="min-width: 85px;max-width: 350px !important">{% trans 'Name' %}</th>
                <th style="min-width: 85px !important">{% trans 'Jan Code' %}</th>
                <th style="min-width: 95px !important">{% trans 'Varieties' %}</th>
                <th class="text-right" style="min-width: 30px !important">{% trans 'Stock' %}</th>
                <th class="text-right" style="min-width: 70px !important">{% trans 'Price' %}</th>
                <th style="min-width: 85px !important">{% trans 'Published Date' %}</th>
                <th class="text-center" style="min-width:90px !important;">{% trans 'Options' %}</th>
            </tr>
            </thead>
        </table>
    </div>
</div>
