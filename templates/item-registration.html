<!DOCTYPE html>
<html lang="en">
  <head>
    <head>
      <meta
        charset="utf-8"
        name="viewport"
        content="width=device-width, initial-scale=1.0"
      />
      <meta name="description" content="" />
      {% load static %}
      <script src='https://kit.fontawesome.com/a076d05399.js'></script>
      <link href="{% static 'css/font-awesome.min.css' %}" rel="stylesheet" />
      <!-- Bootstrap core CSS -->
      <link
        rel="stylesheet"
        type="text/css"
        href="{% static 'css/bootstrap.min.css' %}"
      />
      <link
        rel="stylesheet"
        type="text/css"
        href="{% static 'css/bootstrap-grid.min.css' %}"
      />
      <link
        rel="stylesheet"
        type="text/css"
        href="{% static 'css/bootstrap-reboot.min.css' %}"
      />
      <link
        rel="stylesheet"
        type="text/css"
        href="{% static 'css/bootstrap-datetimepicker.min.css' %}"
      />
      
      <!--external css-->
      <link
        rel="stylesheet"
        type="text/css"
        href="{% static 'assets/jquery-ui/jquery-ui.min.css' %}"
      />
      <!-- Custom styles for this template -->
      <link
        rel="stylesheet"
        type="text/css"
        href="{% static 'css/style.css' %}?{% now 'H' %}"
      />
      <link
        rel="stylesheet"
        type="text/css"
        href="{% static 'css/style-responsive.css' %}"
      />

     
      <!-- <script src="{% static 'js/jquery.js' %}"></script>
      <script src="{% static 'js/bootstrap.min.js' %}"></script>
      <script src="{% static 'js/moment.js' %}"></script>
      <script src="{% static 'js/bootstrap-datetimepicker.min.js' %}"></script> -->
      
      
      <!-- HTML5 shim and Respond.js IE8 support of HTML5 tooltipss and media queries -->
      <!--[if lt IE 9]>
        <script src="js/html5shiv.js"></script>
        <script src="js/respond.min.js"></script>
      <![endif]-->
      <title>Item Registration</title>
  </head>
  <body>
    <div class="container">
      <h3 class="m-4">Create Product</h3>
      <form action="/api/products" class="bg-light m-2 p-5">
        <div class="row">

          <!--Starts left side inputs-->
          <div class="col-md-7">

            <div class="form-group row">
              <label class="col-md-6 p-2" for="name">Official Product Name:</label>
              <input type="text" class="form-control col-md-6" id="name">
            </div>

            <div class="form-group row">
              <label class="col-md-6 p-2" for="name">Brand or manufacturer name:</label>
              <input type="text" class="form-control col-md-6" id="name">
            </div>

            <div class="form-group row">
              <label class="col-md-6 p-2" for="name">Product ID(URL):</label>
              <input type="text" class="form-control col-md-6" id="name">
            </div>
            
            <div class="form-group row">
              <label class="col-md-6 p-2" for="name">Product Category:</label>
              <select class="form-control col-md-6 custom-select" id="name">
                <option>Category 1</option>
                <option>Category 2</option>
              </select>
            </div>

            <div class="form-group row">
              <label class="col-md-4 p-2" for="name">Variations:</label>
              <div class="custom-control custom-radio custom-control-inline col-md-2">
                <input type="radio" id="customRadioInline1" name="customRadioInline1" class="custom-control-input">
                <label class="custom-control-label p-2" for="customRadioInline1">1 Item</label>
              </div>
              <div class="custom-control custom-radio custom-control-inline col-md-2">
                <input type="radio" id="customRadioInline2" name="customRadioInline1" class="custom-control-input">
                <label class="custom-control-label p-2" for="customRadioInline2">2 Item</label>
              </div>
              <div class="custom-control custom-radio custom-control-inline col-md-2">
                <input type="radio" id="customRadioInline3" name="customRadioInline1" class="custom-control-input">
                <label class="custom-control-label p-2" for="customRadioInline3">None</label>
              </div>
            </div>

            <div class="form-group row">
              <label class="col-md-6 p-2" for="name">JAN code:</label>
              <input type="text" class="form-control col-md-6" id="name">
            </div>

            <div class="form-group row">
              <label class="col-md-6 p-2" for="name">Stock Quantity:</label>
              <input type="text" class="form-control col-md-3" id="name">
            </div>

            <div class="form-group row">
              <label class="col-md-4 p-2" for="name">Status:</label>
              <div class="custom-control custom-radio custom-control-inline col-md-2">
                <input type="radio" id="customRadioInline4" name="customRadioInline1" class="custom-control-input">
                <label class="custom-control-label p-2" for="customRadioInline4">Published</label>
              </div>
              <div class="custom-control custom-radio custom-control-inline col-md-4">
                <input type="radio" id="customRadioInline5" name="customRadioInline2" class="custom-control-input">
                <label class="custom-control-label p-2" for="customRadioInline5">Non Published</label>
              </div>
            </div>

            
            <div class="form-group row">
              <label class="col-md-6" for="name">Published Date:</label>

              <div class="col-md-6 input-group" id="datetimepicker">
                <input type="date" class="form-control">
                <div class="input-group-append">
                  <span class="input-group-text">
                    <i class="far">&#xf073;</i>
                  </span>
                </div>
                
                  
                  
              </div>
              <p class="text-danger">* Before the release date, it will not be published even if it is set to “Publish”.</p >
            </div>

            <div class="form-group row form-check form-check-inline">
              <label class="col-md-5" for="name">Product COndition:</label>
              <div class="custom-control custom-radio custom-control-inline col-md-2">
                <input type="radio" id="customRadioInline4" name="customRadioInline1" class="custom-control-input form-check-input">
                <label class="form-check-label custom-control-label" for="customRadioInline4">New</label>
              </div>
              <div class="custom-control custom-radio custom-control-inline col-md-4">
                <input type="radio" id="customRadioInline5" name="customRadioInline2" class="custom-control-input form-check-input">
                <label class="form-check-label custom-control-label" for="customRadioInline5">Second Hand Goods</label>
              </div>

            </div>

            <div class="form-group row form-check form-check-inline">
              <label class="col-md-5" for="name">For Sale:</label>
              <div class="custom-control custom-radio custom-control-inline col-md-2">
                <input type="radio" id="customRadioInline4" name="customRadioInline1" class="custom-control-input form-check-input">
                <label class="form-check-label custom-control-label" for="customRadioInline4">All Users</label>
              </div>
              <div class="custom-control custom-radio custom-control-inline col-md-2">
                <input type="radio" id="customRadioInline5" name="customRadioInline2" class="custom-control-input form-check-input">
                <label class="form-check-label custom-control-label" for="customRadioInline5">General Only</label>
              </div>
              <div class="custom-control custom-radio custom-control-inline col-md-2">
                <input type="radio" id="customRadioInline5" name="customRadioInline2" class="custom-control-input form-check-input">
                <label class="form-check-label custom-control-label" for="customRadioInline5">Store Only</label>
              </div>
              <p class="text-danger">* Displayed only to target users</p>
            </div>
            
            
          </div>
          <!--Ends left side inputs-->

          <!--Starts right side inputs-->
          <div class="col-md-5">
            <div class="form-group row">
              <label class="col-md-6 text-center p-2" for="price">General Price:</label>
              <input type="text" class="form-control col-md-6" id="price">
              
            </div>

            <div class="form-group row">
              <label class="col-md-6 text-center p-2" for="price">Store Price:</label>
              <input type="text" class="form-control col-md-6" id="price">
              
            </div>

            <div class="form-group row">
              <label class="col-md-6 text-center p-2" for="price">Store Price:</label>
              <input type="text" class="form-control col-md-6" id="price">
              
            </div>

            <div class="form-group row">
              <label class="col-md-6 text-center p-2" for="price">Shipping:</label>
              <input type="text" class="form-control col-md-6" id="price">
              
            </div>

            <div class="form-group row">
              <label class="col-md-6 text-center p-2" for="price">PR Statement:</label>
              <input type="text" class="form-control col-md-6" id="price">
              
            </div>

            <div class="form-group row">
              <label class="col-md-6 text-center p-2" for="price">Product Description:</label>
              <textarea class="form-control col-md-6" id="price" rows="6"></textarea>
              
            </div>

            <div class="form-group row">
              <div class="input-group mb-3 m-5">
                <div class="input-group-prepend">
                  <span style="padding: 3px" class="input-group-text">Upload</span>
                </div>
                <div class="custom-file">
                  <input type="file" class="custom-file-input" id="inputGroupFile01">
                  <label class="custom-file-label" for="inputGroupFile01">Choose file</label>
                </div>
              </div>
              
            </div>


          </div>
          <!--Ends left side inputs-->
          
          <div class="col-md-6">
            <input type="submit" class="btn btn-default col-md-2 bg-primary m-5 text-white" value="Save">
            <p class="btn btn-default bg-secondary m-2 text-white">Cancell</p>
          </div>
         
      </form> 
    </div>



  </body>
</html>
