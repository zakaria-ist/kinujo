<!DOCTYPE html>
<html lang="en">
  <head>
    <head>
      <meta
        charset="utf-8"
        name="viewport"
        content="width=device-width, initial-scale=1.0"
      />
      <meta name="description" content="" />
      {% load static %}
  
      <!-- Bootstrap core CSS -->
      <link
        rel="stylesheet"
        type="text/css"
        href="{% static 'css/bootstrap.min.css' %}"
      />
      <link
        rel="stylesheet"
        type="text/css"
        href="{% static 'css/bootstrap-grid.min.css' %}"
      />
      <link
        rel="stylesheet"
        type="text/css"
        href="{% static 'css/bootstrap-reboot.min.css' %}"
      />
      <!--external css-->
      <link
        rel="stylesheet"
        type="text/css"
        href="{% static 'assets/jquery-ui/jquery-ui.min.css' %}"
      />
      <!-- Custom styles for this template -->
      <link
        rel="stylesheet"
        type="text/css"
        href="{% static 'css/style.css' %}?{% now 'H' %}"
      />
      <link
        rel="stylesheet"
        type="text/css"
        href="{% static 'css/style-responsive.css' %}"
      />
  
      <!-- HTML5 shim and Respond.js IE8 support of HTML5 tooltipss and media queries -->
      <!--[if lt IE 9]>
        <script src="js/html5shiv.js"></script>
        <script src="js/respond.min.js"></script>
      <![endif]-->
  
      <title>Item Registration</title>
  </head>
  <body>
    <div class="container">
      <h3 class="m-4">Create Product</h3>
      <form action="/api/products" class="bg-light m-2 p-5">
        <div class="row">

          <!--Starts left side inputs-->
          <div class="col-md-5">

            <div class="form-group row">
              <label class="col-md-6" for="name">Official Product Name:</label>
              <input type="text" class="form-control col-md-6" id="name">
            </div>

            <div class="form-group row">
              <label class="col-md-6" for="name">Brand or manufacturer name:</label>
              <input type="text" class="form-control col-md-6" id="name">
            </div>

            <div class="form-group row">
              <label class="col-md-6" for="name">Product ID(URL):</label>
              <input type="text" class="form-control col-md-6" id="name">
            </div>
            
            <div class="form-group row">
              <label class="col-md-6" for="name">Product Category:</label>
              <select class="form-control col-md-6 custom-select" id="name">
                <option>Category 1</option>
                <option>Category 2</option>
              </select>
            </div>

            <div class="form-group row">
              <label class="col-md-4" for="name">Variations:</label>
              <div class="custom-control custom-radio custom-control-inline col-md-2">
                <input type="radio" id="customRadioInline1" name="customRadioInline1" class="custom-control-input">
                <label class="custom-control-label" for="customRadioInline1">1 Item</label>
              </div>
              <div class="custom-control custom-radio custom-control-inline col-md-2">
                <input type="radio" id="customRadioInline2" name="customRadioInline1" class="custom-control-input">
                <label class="custom-control-label" for="customRadioInline2">2 Item</label>
              </div>
              <div class="custom-control custom-radio custom-control-inline col-md-2">
                <input type="radio" id="customRadioInline3" name="customRadioInline1" class="custom-control-input">
                <label class="custom-control-label" for="customRadioInline3">None</label>
              </div>
            </div>

            <div class="form-group row">
              <label class="col-md-6" for="name">JAN code:</label>
              <input type="text" class="form-control col-md-6" id="name">
            </div>

            <div class="form-group row">
              <label class="col-md-6" for="name">Stock Quantity:</label>
              <input type="text" class="form-control col-md-3" id="name">
            </div>

            <div class="form-group row">
              <label class="col-md-4" for="name">Status:</label>
              <div class="custom-control custom-radio custom-control-inline col-md-2">
                <input type="radio" id="customRadioInline4" name="customRadioInline1" class="custom-control-input">
                <label class="custom-control-label" for="customRadioInline4">Published</label>
              </div>
              <div class="custom-control custom-radio custom-control-inline col-md-4">
                <input type="radio" id="customRadioInline5" name="customRadioInline2" class="custom-control-input">
                <label class="custom-control-label" for="customRadioInline5">Non Published</label>
              </div>
            </div>

            <input data-provide="datepicker">
            
          </div>
          <!--Ends left side inputs-->

          <!--Starts right side inputs-->
          <div class="col-md-5">
            <div class="form-group row">
              <label class="col-md-6 text-center" for="price">General Price:</label>
                <input type="text" class="form-control col-md-6" id="price">
              </div>
            </div>
          </div>
          <!--Ends left side inputs-->

        <button type="submit" class="btn btn-default">Submit</button>
      </form> 
    </div>

  </body>
</html>
