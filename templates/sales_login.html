<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    {% load static %}
    {% load i18n %}

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.min.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap-grid.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap-reboot.min.css' %}">
    <!--external css-->
    <link rel="stylesheet" type="text/css" href="{% static 'assets/jquery-ui/jquery-ui.min.css' %}">
    <!-- Custom styles for this template -->
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}?{% now 'H' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/style-responsive.css' %}"/>

    <!-- HTML5 shim and Respond.js IE8 support of HTML5 tooltipss and media queries -->
    <!--[if lt IE 9]>
    <script src="js/html5shiv.js"></script>
    <script src="js/respond.min.js"></script>
    <![endif]-->

    <title>Kinujo login</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'img/favicon.ico' %}"/>
    <link href="{% static "css/select2/select2.css" %}" rel="stylesheet">
    <style>
      .select2{
        font-size: 16px;
      }
      .select2-selection__rendered {
          line-height: 47px !important;
      }
      .select2-container .select2-selection--single {
          height: 47px !important;
      }
      .select2-selection__arrow {
          height: 47px !important;
      }
    </style>
</head>

<body class="login-body">

<div class="container">
    <form class="form-signin" action="/sales_login/" method="post" id="login_form">
        {% csrf_token %}
        <h2 class="form-signin-heading">KINUJO</h2>
        <div class="text-center"><p>{% trans "Listing Management Site" %}</p></viv>
        <p class="login-wrap">
            <label class="messages text-center">{{ state }}</label>
            <input type="hidden" class="form-control" name="username" id="username" style="display: none"> 
            <div class="row col-lg-12" style="padding-right: 0px !important;">
              <div class="col-lg-5" style="padding-right: 0px !important;">
                  <select name="tel_code" id="tel_code" class="form-control">
                      {% for code in tel_code_list %}
                          <option data-code_data="{{code.tel_code}}" value="{{code.id}}">{{code.name}}({{code.tel_code}})</option>
                      {% endfor %}
                  </select>
              </div>
              <div class="col-lg-7" style="padding-left: 5px !important; padding-right: 0px !important;">
                <input type="tel" class="form-control" placeholder="" name="tel" id="tel" autofocus required autocomplete="off"> 
              </div>
            </div>
            <div class="col-lg-12">
              <input type="password" class="form-control" placeholder="パスワード" name="password" required autocomplete="off">
            </div>

            <div class="forget_pass text-center">
                <label class="checkbox">
                    <span class="pull-right" style="">
                        <a href="{% url 'pass_reset' %}">{% trans "I forgot the password"%}</a>
                    </span>
                </label>
            </div>
            <div class="text-center">
                <button class="btn btn-lg btn-login" type="submit">Login</button>
            </div>
        </p>
    </form>
</div>


<script src="{% static 'js/jquery.js' %}"></script>
<script src="{% static 'js/bootstrap.min.js' %}"></script>
<script src="{% static "js/select2/select2.js" %}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.18.1/moment.min.js"></script>
<script type="text/javascript" src="{% static 'assets/jquery-ui/jquery-ui.min.js' %}"></script>

<!-- js placed at the end of the document so the pages load faster -->
<script type="text/javascript">

//phone pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"

$(document).ready(function() {
  $(window).keydown(function(event){
    if((event.keyCode == 13) && ($(event.target)[0]==$("input")[1])) { // username
        $('[name="password"]').focus();
        $('[name="password"]').select();
        event.preventDefault();
        return false;
    }
    else if((event.keyCode == 13) && ($(event.target)[0]==$("input")[2])) { // password
        setTimeout(function(){
            $('.btn-login').focus(); // submit btn
        }, 100);
        event.preventDefault();
        return false;
    }
  });

  $('#tel_code').select2({});
  $('#tel_code').on('select2:close', function() {
    $('#tel').focus();
    $('#tel').select();
  });
});

$('#login_form').on('submit', function(e) {
  var code = $('#tel_code').find('option:selected').data('code_data');
  var tel = $('#tel').val();
  var username = code + tel;
  $('#username').val(username);
})


$(document).on('click', 'input[type="text"]', function(){
    $(this).select();
});

$(document).on('click', 'input[type="number"]', function(){
    $(this).select();
});

$(document).on('click', 'input[type="password"]', function(){
    $(this).select();
});

</script>

</body>
</html>
