<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    {% load static %}
    {% load i18n %}

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.min.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap-grid.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap-reboot.min.css' %}">
    <!--external css-->
    <link rel="stylesheet" type="text/css" href="{% static 'assets/jquery-ui/jquery-ui.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/jquery-confirm.min.css' %}"/>
    <!-- Custom styles for this template -->
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}?{% now 'H' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/style-responsive.css' %}"/>

    <!-- HTML5 shim and Respond.js IE8 support of HTML5 tooltipss and media queries -->
    <!--[if lt IE 9]>
    <script src="js/html5shiv.js"></script>
    <script src="js/respond.min.js"></script>
    <![endif]-->

    <title>Kinujo login</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'img/favicon.ico' %}"/>
</head>

<body class="login-body">

<div class="container">

    <form class="form-signin" action="/reset_password/" method="post" id="reset_form">
        {% csrf_token %}
        <h2 class="form-signin-heading">KINUJO</h2>
        <div class="login-wrap">
            <div class="text-left">
                <p>{% trans "We will send you an authorization code." %}</p>
                <p>{% trans "Please enter your phone number and press send." %}</p>
            </div>
            <input type="tel" name="user_phone" id="user_phone" placeholder="{% trans 'cell phone number' %}" autocomplete="off"
                    class="form-control placeholder-no-fix">
            <div class="text-center mt-3">
                <button class="btn btn-success btn-login" id="send_code" type="button" onclick="onSendingCode()">{% trans "Send"%}</button>
            </div>
            <div class="mt-2">
                <p id="timer_p" style="display: none;"><span id="timer_span"></span>{% trans " until resendable" %}</p>
            </div>
            <div class="mt-3">
                <input type="text" name="code" id="code" placeholder="{% trans 'Please enter the verification code' %}" autocomplete="off"
                    class="form-control placeholder-no-fix">
            </div>
            <div class="mt-5">
                <p>{% trans "New password setting" %}</p>
            </div>
            <input type="password" name="new_pass" id="new_pass" placeholder="{% trans 'new password' %}" autocomplete="off"
                    class="form-control placeholder-no-fix">
            <span id="pass-error" class="span-required" style="display: none">Passwords do not match</span>
            <input type="password" name="confirm_new_pass" id="confirm_new_pass" placeholder="{% trans 'New password (re-enter)' %}" autocomplete="off"
                    class="form-control placeholder-no-fix">
            <div class="text-center">
                <button class="btn btn-success btn-login" id="send_new_pass" type="submit">{% trans "Change the password" %}</button>
            </div>
        </div>
    </form>
</div>


<script src="{% static 'js/jquery.js' %}"></script>
<script src="{% static 'js/bootstrap.min.js' %}"></script>
<script type="text/javascript" src="{% static 'js/jquery-confirm.min.js' %}"></script>
<script type="text/javascript" src="{% static 'assets/jquery-ui/jquery-ui.min.js' %}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.18.1/moment.min.js"></script>

<!-- js placed at the end of the document so the pages load faster -->
<script type="text/javascript">
    var user_phone = '';
    $(document).ready(function() {
    
    });


    $(document).on('click', 'input[type="text"]', function(){
        $(this).select();
    });

    $(document).on('click', 'input[type="number"]', function(){
        $(this).select();
    });

    $(document).on('click', 'input[type="password"]', function(){
        $(this).select();
    });

</script>

<!-- The core Firebase JS SDK is always required and must be listed first -->
<script src="https://www.gstatic.com/firebasejs/7.22.0/firebase-app.js"></script>

<!-- TODO: Add SDKs for Firebase products that you want to use
     https://firebase.google.com/docs/web/setup#available-libraries 
<script src="https://www.gstatic.com/firebasejs/7.22.0/firebase-analytics.js"></script>-->
<script src="https://www.gstatic.com/firebasejs/7.22.0/firebase-auth.js"></script>

<script>
    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    var firebaseConfig = {
        apiKey: "AIzaSyAygaQjp9GYXZ43OYJc7UxhWCpg9DQJSzE",
        authDomain: "kinujo-18d20.firebaseapp.com",
        databaseURL: "https://kinujo-18d20.firebaseio.com",
        projectId: "kinujo-18d20",
        storageBucket: "kinujo-18d20.appspot.com",
        messagingSenderId: "992565142938",
        appId: "1:992565142938:web:09b233cc916f5c7ad0c623",
        measurementId: "G-1P4KWPBD6H"
    };
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    //firebase.analytics();

    //firebase.auth().settings.appVerificationDisabledForTesting = true;
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('send_code', {
        'size': 'invisible',
        'callback': function(response) {
            // reCAPTCHA solved, allow signInWithPhoneNumber.
            //onSendingCode();
        }
    });

    var timer = 30;
    var interval_id;
    function onSendingCode() {
        var phoneNumber = $('#user_phone').val(); // need to verify the phonenumber
        if (phoneNumber != '') {
            $.ajax({
                type: "GET",
                url: "/profiles/validate_user_phone/" + phoneNumber + "/",
                success: function (data) {
                    if (data.message != 'Error') {
                        var appVerifier = window.recaptchaVerifier;
                        firebase.auth().signInWithPhoneNumber(phoneNumber, appVerifier)
                        .then(function (confirmationResult) {
                            // SMS sent. Prompt user to type the code from the message, then sign the
                            // user in with confirmationResult.confirm(code).
                            window.confirmationResult = confirmationResult;
                            $('#timer_p').show();
                            $('#send_code').attr('disabled', true);
                            interval_id = setInterval(()=>{
                                if (timer > 0) {
                                    $('#timer_span').text(timer+'s');
                                    timer--;
                                } else {
                                    clearInterval(interval_id);
                                    $('#timer_p').hide();
                                    $('#send_code').attr('disabled', false);
                                    timer = 30;
                                }
                                
                            }, 1000);
                            $.confirm({
                                title: 'Code is Sent!',
                                content: 'A verification code is sent to your number',
                                buttons: {
                                    Ok: {
                                        btnClass: 'btn-success',
                                        action: function(){}
                                        }
                                    }
                            });
                            user_phone = phoneNumber;
                        }).catch(function (error) {
                            // Error; SMS not sent
                            // ...
                            window.recaptchaVerifier.render().then(function(widgetId) {
                                grecaptcha.reset(widgetId);
                            });
                            
                            $.confirm({
                                title: 'Wrong number!',
                                content: 'Please check your number and try again.',
                                buttons: {
                                    Ok: {
                                        btnClass: 'btn-success',
                                        action: function(){}
                                        }
                                    }
                            });
                        });
                    } else {
                        $.confirm({
                            title: 'Wrong number!',
                            content: 'The user is not registered.',
                            buttons: {
                                Ok: {
                                    btnClass: 'btn-success',
                                    action: function(){}
                                    }
                                }
                        });
                    }
                }
            });
        }
        
    }

    var is_verified = false;
    $('#code').on('change', function() {
        var code = $('#code').val();
        if (code != '') {
            window.confirmationResult.confirm(code).then(function (result) {
                // User signed in successfully.
                var user = result.user;
                $('#user_phone').val(user_phone);
                is_verified = true;
                $('#send_new_pass').prop('disabled', false);
                $.confirm({
                    title: 'Vericication Successful',
                    content: 'Please enter new password to log in.',
                    buttons: {
                        Ok: {
                            btnClass: 'btn-success',
                            action: function(){}
                            }
                        }
                });
            }).catch(function (error) {
                // User couldn't sign in (bad verification code?)
                // ...
                $.confirm({
                    title: 'Wrong Code',
                    content: 'Please check your varification code again.',
                    buttons: {
                        Ok: {
                            btnClass: 'btn-success',
                            action: function(){}
                            }
                        }
                });
            });
        }
    })

    $('#send_new_pass').prop('disabled', true);
    
    $('#confirm_new_pass').on('change', function(e) {
        var pass = $('#new_pass').val();
        var conf_pass = $(this).val();
        if (pass != conf_pass) {
            $('#pass-error').removeAttr('style');
            $('#send_new_pass').prop('disabled', true);
        } else {
            $('#pass-error').css('display', 'none');
            $('#send_new_pass').prop('disabled', false);
        }
    })
    $('#new_pass').on('change', function(e) {
        var pass = $(this).val();
        var conf_pass = $('#confirm_new_pass').val();
        if (pass != conf_pass) {
            $('#pass-error').removeAttr('style');
            $('#send_new_pass').prop('disabled', true);
        } else {
            $('#pass-error').css('display', 'none');
            $('#send_new_pass').prop('disabled', false);
        }
    })
    $('#reset_form').on('submit', function(e) {
        if (is_verified) {
            var pass = $('#new_pass').val();
            var conf_pass = $('#confirm_new_pass').val();
            if (pass != conf_pass) {
                $('#pass-error').removeAttr('style');
                e.preventDefault();
            }
        } else {
            e.preventDefault();
            $.confirm({
                title: 'Error',
                content: 'Please verify first.',
                buttons: {
                    Ok: {
                        btnClass: 'btn-success',
                        action: function(){}
                        }
                    }
            });
        }
    })

    $(document).on('click', 'input[type="text"]', function(){
        $(this).select();
    });

    $(document).on('click', 'input[type="number"]', function(){
        $(this).select();
    });

    $(document).on('click', 'input[type="password"]', function(){
        $(this).select();
    });

</script>

</body>
</html>
